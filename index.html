<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Cosmic-S</title>
  <link rel="icon" type="image/png" href="https://cosmic-seea.neocities.org/stamp-5.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #000000;
      background-image: 
        linear-gradient(rgba(240, 232, 213, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240, 232, 213, 0.18) 1px, transparent 1px);
      background-size: 20px 20px;
      position: relative;
    }

    /* Chat Header */
    .chat-header {
      background-color: #000000;
      color: #F0E8D5;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #F0E8D5;
      flex-shrink: 0;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      color: #F0E8D5;
      text-decoration: none;
      font-size: 16px;
      padding: 5px;
      cursor: pointer;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #F0E8D5;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border: none;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .menu-container {
      position: relative;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #F0E8D5;
      font-size: 18px;
      cursor: pointer;
      padding: 5px;
    }

    /* Dropdown Menu */
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 40px;
      background-color: #111111;
      border: 2px solid #F0E8D5;
      border-radius: 10px;
      width: 250px;
      padding: 15px;
      color: #F0E8D5;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      z-index: 100;
      font-size: 13px;
      line-height: 1.5;
    }

    .dropdown-menu h4 {
      margin-bottom: 8px;
      border-bottom: 1px solid #F0E8D5;
      padding-bottom: 4px;
      font-size: 14px;
    }

    .dropdown-menu a {
      color: #F0E8D5;
      text-decoration: underline;
      display: block;
      margin-top: 6px;
    }

    /* Messages Area */
    .chat-messages {
      flex: 1;
      padding: 20px 20px 20px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 88%;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.received {
      align-self: flex-start;
    }

    .message-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #F0E8D5;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message-content {
      display: flex;
      flex-direction: column;
    }

    .sender-name {
      font-size: 11px;
      font-weight: bold;
      color: #F0E8D5;
      margin-bottom: 3px;
      padding-left: 4px;
      text-shadow: 1px 1px 2px #000;
    }

    .sent .sender-name {
      text-align: right;
      padding-right: 4px;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      border: 2px solid #F0E8D5;
    }

    .received .message-bubble {
      background-color: #111111;
      color: #F0E8D5;
      border-bottom-left-radius: 2px;
      box-shadow: 2px 2px 0px #F0E8D5;
    }

    .sent .message-bubble {
      background-color: #F0E8D5;
      color: #111111;
      border-bottom-right-radius: 2px;
      box-shadow: 2px 2px 0px #555555;
    }

    /* Links inside bubbles */
    .chat-link-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 12px;
      background: #000000;
      color: #F0E8D5;
      border: 2px solid #F0E8D5;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 2px 2px 0px #F0E8D5;
      transition: transform 0.1s;
    }

    .chat-link-btn:hover {
      background: #F0E8D5;
      color: #000000;
    }

    .chat-link-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #F0E8D5;
    }

    /* Interactive Options Bar (Bottom Keyboard Replacement) */
    .chat-input-bar {
      background-color: #000000;
      border-top: 2px solid #F0E8D5;
      padding: 12px 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .input-title {
      font-size: 11px;
      color: #F0E8D5;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    .options-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option-btn {
      background-color: #111111;
      color: #F0E8D5;
      border: 2px solid #F0E8D5;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 2px 2px 0px #F0E8D5;
      transition: all 0.15s ease;
    }

    .option-btn:hover {
      background-color: #F0E8D5;
      color: #111111;
    }

    .option-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #F0E8D5;
    }

    /* Footer Credits Box inside Chat */
    .chat-footer-credits {
      text-align: center;
      padding: 20px 0 10px 0;
      color: #F0E8D5;
      font-size: 12px;
      opacity: 0.8;
      border-top: 1px dashed rgba(240, 232, 213, 0.3);
      margin-top: 20px;
    }

    .chat-footer-credits a {
      color: #F0E8D5;
      text-decoration: underline;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="user-info">
        <a href="https://cosmic-seea.neocities.org/" class="back-btn" title="Back Home"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="avatar">
          <img src="https://cosmic-seea.neocities.org/stamp-8.png" alt="Cosmic-S" onerror="this.style.display='none'; this.parentNode.innerText='CS';">
        </div>
        <div>
          <span style="font-weight: bold; display: block; font-size: 14px;">Cosmic-S System [404]</span>
          <span style="font-size: 11px; color: #F0E8D5; opacity: 0.7;">Signal Lost in Deep Space</span>
        </div>
      </div>
      <div class="menu-container">
        <button class="menu-btn" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="dropdown-menu" id="dropdownMenu">
          <h4>404 Emergency Nav</h4>
          <a href="https://cosmic-seea.neocities.org/">🏠 Main Site Home</a>
          <a href="https://cosmic-seea.neocities.org/CosmicClub">🪐 Cosmic Club</a>
          <a href="https://seea-star.github.io/Cosmic-S-Stories/">📖 Stories Page</a>
        </div>
      </div>
    </div>

    <!-- Messages Area -->
    <div class="chat-messages" id="chatBox"></div>

    <!-- Interactive Options Bar -->
    <div class="chat-input-bar">
      <div class="input-title"><i class="fa-solid fa-reply"></i> Choose your answer:</div>
      <div class="options-wrapper" id="optionsBox">
        <!-- Generato via JS -->
      </div>
    </div>
  </div>

  <script>
    const avatarBot = "https://cosmic-seea.neocities.org/stamp-8.png";
    const avatarUser = "https://cosmic-seea.neocities.org/stamp-5.png";

    const chatBox = document.getElementById('chatBox');
    const optionsBox = document.getElementById('optionsBox');
    const menuToggle = document.getElementById('menuToggle');
    const dropdownMenu = document.getElementById('dropdownMenu');

    // Menu toggle
    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', () => {
      dropdownMenu.style.display = 'none';
    });

    // Funzione per aggiungere un messaggio in chat
    function addMessage(sender, name, text, htmlContent = '') {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message-row', sender);

      const avatarSrc = sender === 'received' ? avatarBot : avatarUser;
      
      msgDiv.innerHTML = `
        <div class="msg-avatar">
          <img src="${avatarSrc}" alt="${name}" onerror="this.style.display='none'; this.parentNode.innerText='${name.substring(0,2).toUpperCase()}';">
        </div>
        <div class="message-content">
          <div class="sender-name">${name}</div>
          <div class="message-bubble">
            <div>${text}</div>
            ${htmlContent}
          </div>
        </div>
      `;

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Scenari di risposta della chat
    const tree = {
      start: {
        botText: "Ehi! Ops... dove sei finito? 🛰️ Questa pagina non esiste o il segnale si è perso nello spazio siderale!",
        options: [
          { label: "Ho cliccato un pulsante da un altro sito!", next: "button_error" },
          { label: "Cercavo il Cosmic Club", next: "go_cosmic" },
          { label: "Volevo leggere le Storie", next: "go_stories" },
          { label: "Mostrami una mappa del sito (Sitemap)", next: "sitemap" }
        ]
      },
      button_error: {
        botText: "Ahhh capisco! 😅 Probabilmente quel sito aveva un piccolo errore nel link del mio pulsante 88x31! Ma niente paura, sei arrivato comunque da me. Dove volevi andare esattamente?",
        options: [
          { label: "Volevo andare alla Home di Cosmic-S", next: "go_home" },
          { label: "Volevo visitare il Cosmic Club!", next: "go_cosmic" },
          { label: "Mostrami tutti i link principali", next: "sitemap" }
        ]
      },
      go_home: {
        botText: "Perfetto! Ecco il raggio traente per ritornare sano e salvo sulla Home Page ufficiale:",
        html: `<a href="https://cosmic-seea.neocities.org/" class="chat-link-btn"><i class="fa-solid fa-house"></i> Vai alla Home Page</a>`,
        options: [
          { label: "Fammi scegliere un'altra destinazione", next: "start" }
        ]
      },
      go_cosmic: {
        botText: "Ecco a te la rotta per entrare nel Cosmic Club e navigare tra i pianeti e siti degli esploratori!",
        html: `<a href="https://cosmic-seea.neocities.org/CosmicClub" class="chat-link-btn"><i class="fa-solid fa-rocket"></i> Entra nel Cosmic Club</a>`,
        options: [
          { label: "Torna indietro", next: "start" }
        ]
      },
      go_stories: {
        botText: "Sei un appassionato di racconti spaziali! Ecco la porta per la libreria delle Storie:",
        html: `<a href="https://seea-star.github.io/Cosmic-S-Stories/" class="chat-link-btn"><i class="fa-solid fa-book-open"></i> Apri le Storie</a>`,
        options: [
          { label: "Torna indietro", next: "start" }
        ]
      },
      sitemap: {
        botText: "Ecco qua le coordinate di tutte le stazioni principali del mio sito:",
        html: `
          <div style="display:flex; flex-direction:column; gap:6px; margin-top:6px;">
            <a href="https://cosmic-seea.neocities.org/" class="chat-link-btn"><i class="fa-solid fa-house"></i> Main Home Page</a>
            <a href="https://cosmic-seea.neocities.org/CosmicClub" class="chat-link-btn"><i class="fa-solid fa-planet-ringed"></i> Cosmic Club Canvas</a>
            <a href="https://seea-star.github.io/Cosmic-S-Stories/" class="chat-link-btn"><i class="fa-solid fa-book"></i> Cosmic Stories</a>
            <a href="https://cosmic-s.atabook.org/" target="_blank" class="chat-link-btn"><i class="fa-solid fa-pen-to-square"></i> Guestbook</a>
          </div>
        `,
        options: [
          { label: "Ricomincia dall'inizio", next: "start" }
        ]
      }
    };

    // Rendering delle opzioni in basso
    function renderOptions(stepKey) {
      optionsBox.innerHTML = '';
      const currentStep = tree[stepKey];

      currentStep.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt.label;
        btn.onclick = () => {
          // Aggiunge la risposta dell'utente
          addMessage('sent', 'You', opt.label);

          // Mostra la risposta del Bot dopo un brevissimo ritardo per simularne la digitazione
          setTimeout(() => {
            const nextStep = tree[opt.next];
            addMessage('received', 'Cosmic-S System', nextStep.botText, nextStep.html || '');
            renderOptions(opt.next);
          }, 350);
        };
        optionsBox.appendChild(btn);
      });
    }

    // Inizio conversazione
    function init404Chat() {
      chatBox.innerHTML = '';
      const startStep = tree['start'];
      addMessage('received', 'Cosmic-S System', startStep.botText);
      renderOptions('start');

      // Aggiunge footer credits in fondo
      const footerCredits = document.createElement('div');
      footerCredits.className = 'chat-footer-credits';
      footerCredits.innerHTML = `Page 404 System | Created by Cosmic-S<br><a href="https://cosmic-seea.neocities.org/" target="_blank">https://cosmic-seea.neocities.org/</a>`;
      chatBox.appendChild(footerCredits);
    }

    init404Chat();
  </script>
</body>
</html>
