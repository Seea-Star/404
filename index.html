<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Cosmic-S</title>
  <link rel="icon" type="image/png" href="https://cosmic-seea.neocities.org/stamp-5.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow-x: hidden;
    }

    .chat-container {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #000000;
      background-image: 
        linear-gradient(rgba(240, 232, 213, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(240, 232, 213, 0.18) 1px, transparent 1px);
      background-size: 20px 20px;
      position: relative;
    }

    /* Chat Header */
    .chat-header {
      background-color: #000000;
      color: #F0E8D5;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 2px solid #F0E8D5;
      flex-shrink: 0;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      color: #F0E8D5;
      text-decoration: none;
      font-size: 16px;
      padding: 5px;
      cursor: pointer;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #F0E8D5;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border: none;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .menu-container {
      position: relative;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #F0E8D5;
      font-size: 18px;
      cursor: pointer;
      padding: 5px;
    }

    /* Dropdown Menu */
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 40px;
      background-color: #111111;
      border: 2px solid #F0E8D5;
      border-radius: 10px;
      width: 250px;
      padding: 15px;
      color: #F0E8D5;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      z-index: 100;
      font-size: 13px;
      line-height: 1.5;
    }

    .dropdown-menu h4 {
      margin-bottom: 8px;
      border-bottom: 1px solid #F0E8D5;
      padding-bottom: 4px;
      font-size: 14px;
    }

    .dropdown-menu a {
      color: #F0E8D5;
      text-decoration: underline;
      display: block;
      margin-top: 6px;
    }

    /* Messages Area */
    .chat-messages {
      flex: 1;
      padding: 20px 20px 60px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 88%;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.received {
      align-self: flex-start;
    }

    .message-row.sent {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #F0E8D5;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .message-content {
      display: flex;
      flex-direction: column;
    }

    .sender-name {
      font-size: 11px;
      font-weight: bold;
      color: #F0E8D5;
      margin-bottom: 3px;
      padding-left: 4px;
      text-shadow: 1px 1px 2px #000;
    }

    .sent .sender-name {
      text-align: right;
      padding-right: 4px;
    }

    .message-bubble {
      padding: 10px 14px;
      border-radius: 15px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      border: 2px solid #F0E8D5;
    }

    .received .message-bubble {
      background-color: #111111;
      color: #F0E8D5;
      border-bottom-left-radius: 2px;
      box-shadow: 2px 2px 0px #F0E8D5;
    }

    .sent .message-bubble {
      background-color: #F0E8D5;
      color: #111111;
      border-bottom-right-radius: 2px;
      box-shadow: 2px 2px 0px #555555;
    }

    /* Fumetto interattivo per la risposta dell'utente */
    .sent .interactive-bubble {
      background-color: #111111;
      color: #F0E8D5;
      border: 2px dashed #F0E8D5;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
      animation: pulseGlow 2s infinite alternate;
    }

    .sent .interactive-bubble:hover {
      background-color: #F0E8D5;
      color: #111111;
      border-style: solid;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 2px 2px 0px #F0E8D5; }
      100% { box-shadow: 4px 4px 10px rgba(240, 232, 213, 0.6); }
    }

    /* Menu di scelta interno alla bolla dell'utente */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .option-choice-btn {
      background: #000000;
      color: #F0E8D5;
      border: 1px solid #F0E8D5;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .option-choice-btn:hover {
      background: #F0E8D5;
      color: #000000;
    }

    /* Bottoni nei messaggi */
    .buttons-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
    }

    .buttons-container a {
      display: inline-block;
      transition: transform 0.15s ease;
    }

    .buttons-container a:hover {
      transform: scale(1.05);
    }

    .buttons-container img {
      height: 31px;
      width: 88px;
      object-fit: contain;
      border: none;
      display: block;
    }

    .chat-link-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 12px;
      background: #000000;
      color: #F0E8D5;
      border: 2px solid #F0E8D5;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      box-shadow: 2px 2px 0px #F0E8D5;
    }

    .chat-link-btn:hover {
      background: #F0E8D5;
      color: #000000;
    }

    /* Footer Credits Box inside Chat */
    .chat-footer-credits {
      text-align: center;
      padding: 20px 0 10px 0;
      color: #F0E8D5;
      font-size: 12px;
      opacity: 0.8;
      border-top: 1px dashed rgba(240, 232, 213, 0.3);
      margin-top: 30px;
    }

    .chat-footer-credits a {
      color: #F0E8D5;
      text-decoration: underline;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="user-info">
        <a href="https://cosmic-seea.neocities.org/" class="back-btn" title="Back Home"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="avatar">
          <img src="https://cosmic-seea.neocities.org/stamp-5.png" alt="Cosmic-S" onerror="this.style.display='none'; this.parentNode.innerText='CS';">
        </div>
        <div>
          <span style="font-weight: bold; display: block; font-size: 14px;">Page Not Found [404]</span>
          <span style="font-size: 11px; color: #F0E8D5; opacity: 0.7;">Cosmic-S System</span>
        </div>
      </div>
      <div class="menu-container">
        <button class="menu-btn" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="dropdown-menu" id="dropdownMenu">
          <h4>Quick Nav</h4>
          <a href="https://cosmic-seea.neocities.org/">🏠 Main Site Home</a>
          <a href="https://cosmic-seea.neocities.org/CosmicClub">🪐 Cosmic Club</a>
        </div>
      </div>
    </div>

    <!-- Area Messaggi -->
    <div class="chat-messages" id="chatBox"></div>
  </div>

  <script>
    const avatarWebmaster = "https://cosmic-seea.neocities.org/stamp-5.png";
    const avatarUser = "https://cosmic-seea.neocities.org/stamp-8.png";

    const chatBox = document.getElementById('chatBox');
    const menuToggle = document.getElementById('menuToggle');
    const dropdownMenu = document.getElementById('dropdownMenu');

    // Menu toggle
    menuToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.style.display = dropdownMenu.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', () => {
      dropdownMenu.style.display = 'none';
    });

    // Struttura della conversazione con le nuove opzioni ordinate e gestite
    const chatTree = {
      start: {
        options: [
          { label: "I was on your site and got lost.", next: "site_lost" },
          { label: "I was looking for the Cosmic Club", next: "go_cosmic" },
          { label: "I was on another site, clicked a button, and ended up here.", next: "button_error" }
        ]
      },
      site_lost: {
        webmasterText: "Oh! In that case, you probably clicked a broken link or typed a wrong address. It's better if you head back to the home page. Also, if you found a broken link or a bug on my site, feel free to report it here:",
        html: `
          <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px;">
            <a href="https://cosmic-seea.neocities.org/" class="chat-link-btn"><i class="fa-solid fa-house"></i> Go to Home Page</a>
            <a href="https://docs.google.com/forms/" target="_blank" class="chat-link-btn"><i class="fa-solid fa-bug"></i> Report a broken link / bug</a>
          </div>
        `,
        options: [
          { label: "Go back to start", next: "start" }
        ]
      },
      go_cosmic: {
        webmasterText: "Ah, looking for the Cosmic Club? Here is the correct portal to enter:",
        html: `
          <div class="buttons-container">
            <a href="https://cosmic-seea.neocities.org/CosmicClub" target="_blank"><img src="https://cosmic-seea.neocities.org/CosmicClubButton.gif" alt="Cosmic Club"></a>
          </div>
        `,
        options: [
          { label: "Go back to start", next: "start" }
        ]
      },
      button_error: {
        webmasterText: "Ah, I see! Was it one of these two buttons? If a button from another site sent you here by mistake, you can let me know which site it was so I can check it or ask them to fix it:",
        html: `
          <div style="margin-top: 6px; font-size: 13px;">Click the button you were trying to visit:</div>
          <div class="buttons-container">
            <a href="https://cosmic-seea.neocities.org/" target="_blank"><img src="https://cosmic-seea.neocities.org/button.gif" alt="Cosmic-S"></a>
            <a href="https://cosmic-seea.neocities.org/CosmicClub" target="_blank"><img src="https://cosmic-seea.neocities.org/CosmicClubButton.gif" alt="Cosmic Club"></a>
          </div>
          <div style="margin-top: 10px;">
            <a href="https://docs.google.com/forms/" target="_blank" class="chat-link-btn"><i class="fa-solid fa-paper-plane"></i> Report broken external button</a>
          </div>
        `,
        options: [
          { label: "Take me back to start", next: "start" }
        ]
      }
    };

    // Aggiunge messaggio Webmaster
    function addWebmasterMessage(text, htmlContent = '') {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message-row', 'received');
      msgDiv.innerHTML = `
        <div class="msg-avatar">
          <img src="${avatarWebmaster}" alt="Webmaster" onerror="this.style.display='none'; this.parentNode.innerText='CS';">
        </div>
        <div class="message-content">
          <div class="sender-name">Cosmic-S</div>
          <div class="message-bubble">
            <div>${text}</div>
            ${htmlContent}
          </div>
        </div>
      `;
      chatBox.appendChild(msgDiv);
      scrollToBottom();
    }

    // Aggiunge fumetto vuoto con opzioni per l'utente
    function addUserPromptBubble(stepKey) {
      const step = chatTree[stepKey];
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message-row', 'sent');
      msgDiv.id = 'activePromptRow';

      msgDiv.innerHTML = `
        <div class="msg-avatar">
          <img src="${avatarUser}" alt="You" onerror="this.style.display='none'; this.parentNode.innerText='YOU';">
        </div>
        <div class="message-content">
          <div class="sender-name">You</div>
          <div class="message-bubble interactive-bubble" id="promptBubble">
            <div><i class="fa-solid fa-ellipsis"></i> <i>Click to reply...</i></div>
            <div class="options-list" id="promptOptions" style="display: none;"></div>
          </div>
        </div>
      `;

      chatBox.appendChild(msgDiv);
      scrollToBottom();

      const promptBubble = msgDiv.querySelector('#promptBubble');
      const promptOptions = msgDiv.querySelector('#promptOptions');

      promptBubble.addEventListener('click', function handlePromptClick(e) {
        if (promptOptions.style.display === 'none') {
          promptOptions.style.display = 'flex';
          promptBubble.style.borderStyle = 'solid';
        }
      });

      step.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-choice-btn';
        btn.textContent = opt.label;
        btn.onclick = (e) => {
          e.stopPropagation();
          selectUserOption(opt.label, opt.next);
        };
        promptOptions.appendChild(btn);
      });
    }

    function selectUserOption(chosenLabel, nextStepKey) {
      const activePromptRow = document.getElementById('activePromptRow');
      if (activePromptRow) {
        const bubble = activePromptRow.querySelector('.message-bubble');
        bubble.classList.remove('interactive-bubble');
        bubble.style.borderStyle = 'solid';
        bubble.innerHTML = `<div>${chosenLabel}</div>`;
        activePromptRow.removeAttribute('id');
      }

      setTimeout(() => {
        const nextStep = chatTree[nextStepKey];
        if (nextStepKey === 'start') {
          addWebmasterMessage("Oh no! Someone is lost again...");
          setTimeout(() => {
            addWebmasterMessage("How did you get here?");
            setTimeout(() => {
              addUserPromptBubble('start');
            }, 300);
          }, 500);
        } else {
          addWebmasterMessage(nextStep.webmasterText, nextStep.html || '');
          setTimeout(() => {
            addUserPromptBubble(nextStepKey);
          }, 300);
        }
      }, 400);
    }

    function scrollToBottom() {
      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: 'smooth'
      });
    }

    function init404Chat() {
      chatBox.innerHTML = '';
      addWebmasterMessage("Oh no! Someone is lost again...");
      setTimeout(() => {
        addWebmasterMessage("How did you get here?");
        setTimeout(() => {
          addUserPromptBubble('start');
        }, 300);
      }, 600);
    }

    init404Chat();
  </script>
</body>
</html>
